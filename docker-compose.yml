services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: image_platform
      POSTGRES_USER: image_platform
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-image_platform}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U image_platform -d image_platform"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - media_data:/app/media
    command: gunicorn image_platform.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120

  generation-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - media_data:/app/media
    command: python manage.py run_generation_worker

  prompt-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    command: python manage.py run_prompt_worker

  proxy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "18083:18083"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro

volumes:
  postgres_data:
  media_data:
