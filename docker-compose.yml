x-app-environment: &app-environment
  DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}"
  DJANGO_DEBUG: "${DJANGO_DEBUG:-0}"
  DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:?Set DJANGO_ALLOWED_HOSTS in .env}"
  DJANGO_CSRF_TRUSTED_ORIGINS: "${DJANGO_CSRF_TRUSTED_ORIGINS:-}"
  DATABASE_URL: "${DATABASE_URL:?Set DATABASE_URL in .env}"
  USE_SQLITE_FOR_TESTS: "${USE_SQLITE_FOR_TESTS:-0}"
  APIMART_API_KEY: "${APIMART_API_KEY:-}"
  APIMART_BASE_URL: "${APIMART_BASE_URL:-https://api.apimart.ai/v1}"
  DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
  DEEPSEEK_BASE_URL: "${DEEPSEEK_BASE_URL:-https://api.deepseek.com}"
  DEEPSEEK_PROMPT_MODEL: "${DEEPSEEK_PROMPT_MODEL:-deepseek-v4-flash}"
  DEEPSEEK_REASONING_EFFORT: "${DEEPSEEK_REASONING_EFFORT:-}"
  DEEPSEEK_THINKING_ENABLED: "${DEEPSEEK_THINKING_ENABLED:-0}"
  APIMART_VISION_MODEL: "${APIMART_VISION_MODEL:-gpt-5-nano-2025-08-07}"
  APIMART_IMAGE_MODEL: "${APIMART_IMAGE_MODEL:-gpt-image-2}"
  APIMART_PROMPT_TIMEOUT_SECONDS: "${APIMART_PROMPT_TIMEOUT_SECONDS:-120}"
  APIMART_FAKE_MODE: "${APIMART_FAKE_MODE:-1}"
  PROMPT_OS_ALLOW_FALLBACK: "${PROMPT_OS_ALLOW_FALLBACK:-0}"
  PROMPT_OS_SLOT_CONCURRENCY: "${PROMPT_OS_SLOT_CONCURRENCY:-3}"
  PROMPT_PREPARATION_STALE_SECONDS: "${PROMPT_PREPARATION_STALE_SECONDS:-300}"
  STORAGE_BACKEND: "${STORAGE_BACKEND:-local}"
  ERP_LOGIN_URL: "${ERP_LOGIN_URL:-}"
  CATALOG_QUERY_URL: "${CATALOG_QUERY_URL:-}"
  CATALOG_ALLOWED_IMAGE_HOSTS: "${CATALOG_ALLOWED_IMAGE_HOSTS:-}"
  OSS_ENDPOINT: "${OSS_ENDPOINT:-}"
  OSS_BUCKET: "${OSS_BUCKET:-}"
  OSS_ACCESS_KEY_ID: "${OSS_ACCESS_KEY_ID:-}"
  OSS_ACCESS_KEY_SECRET: "${OSS_ACCESS_KEY_SECRET:-}"
  OSS_PREFIX: "${OSS_PREFIX:-independent-image-platform}"
  PLATFORM_ADMIN_ERP_USERS: "${PLATFORM_ADMIN_ERP_USERS:-}"
  LOCAL_MEDIA_ROOT: "${LOCAL_MEDIA_ROOT:-/app/media}"
  MAX_ACTIVE_GENERATIONS: "${MAX_ACTIVE_GENERATIONS:-32}"
  GENERATION_USER_ACTIVE_SOFT_LIMIT: "${GENERATION_USER_ACTIVE_SOFT_LIMIT:-5}"
  ORG_DAILY_GENERATION_LIMIT: "${ORG_DAILY_GENERATION_LIMIT:-2000}"
  USER_DAILY_GENERATION_LIMIT: "${USER_DAILY_GENERATION_LIMIT:-100}"
  PROMPT_WORKER_CONCURRENCY: "${PROMPT_WORKER_CONCURRENCY:-16}"
  GENERATION_WORKER_CONCURRENCY: "${GENERATION_WORKER_CONCURRENCY:-16}"

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: image_platform
      POSTGRES_USER: image_platform
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U image_platform -d image_platform"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    image: independent-image-platform-app:${APP_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    environment:
      <<: *app-environment
      ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - media_data:/app/media
    command: gunicorn image_platform.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120
    healthcheck:
      test: ["CMD-SHELL", "python -c \"from urllib.request import urlopen; assert urlopen('http://127.0.0.1:8000/health/live', timeout=2).status == 200\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  generation-worker:
    image: independent-image-platform-app:${APP_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - media_data:/app/media
    command: python manage.py run_generation_worker --concurrency ${GENERATION_WORKER_CONCURRENCY:-16}

  prompt-worker:
    image: independent-image-platform-app:${APP_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
    command: python manage.py run_prompt_worker --concurrency ${PROMPT_WORKER_CONCURRENCY:-16}

  proxy:
    build:
      context: .
      dockerfile: docker/Caddy.Dockerfile
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "${PREVIEW_PORT:-18083}:8080"

volumes:
  postgres_data:
  media_data:
