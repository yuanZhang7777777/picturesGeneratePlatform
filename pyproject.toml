[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "independent-image-platform"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "Django>=5.2,<5.3",
  "Pillow>=10.4,<11",
  "requests>=2.32,<3",
  "oss2>=2.19,<3",
  "psycopg[binary]>=3.2,<4",
  "gunicorn>=22,<23",
  "whitenoise>=6.7,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-django>=4.9,<5",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "image_platform.settings"
python_files = ["test_*.py"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["image_platform*", "platform_app*"]
