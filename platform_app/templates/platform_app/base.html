<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}批量出图平台{% endblock %}</title>
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f7f8fa; color: #1f2937; }
    header { height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; background: #111827; color: white; }
    main { max-width: 1180px; margin: 0 auto; padding: 24px; }
    a { color: #2563eb; text-decoration: none; }
    table { width: 100%; border-collapse: collapse; background: white; }
    th, td { padding: 10px 12px; border-bottom: 1px solid #e5e7eb; text-align: left; }
    input, select, textarea { width: 100%; box-sizing: border-box; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; }
    button, .button { display: inline-flex; align-items: center; min-height: 34px; padding: 0 12px; border: 1px solid #111827; border-radius: 6px; background: #111827; color: white; cursor: pointer; }
    .panel { background: white; border: 1px solid #e5e7eb; border-radius: 8px; padding: 16px; }
    .muted { color: #64748b; }
    .errorlist { color: #b91c1c; }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <header>
    <div>批量出图平台</div>
    <nav>
      {% if user.is_authenticated %}
        <span>{{ user.username }}</span>
      {% endif %}
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
