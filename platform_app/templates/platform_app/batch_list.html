{% extends "platform_app/base.html" %}
{% block title %}我的批次{% endblock %}
{% block content %}
<h1>我的批次</h1>
<p><a class="button" href="{% url 'batch_new' %}">新建批次</a></p>
<table>
  <thead>
    <tr><th>批次</th><th>平台</th><th>站点</th><th>状态</th><th>创建人</th></tr>
  </thead>
  <tbody>
    {% for batch in batches %}
      <tr>
        <td><a href="{% url 'batch_detail' batch.id %}">{{ batch.name }}</a></td>
        <td>{{ batch.platform }}</td>
        <td>{{ batch.site }}</td>
        <td>{{ batch.status }}</td>
        <td>{{ batch.owner.username }}</td>
      </tr>
    {% empty %}
      <tr><td colspan="5" class="muted">暂无批次</td></tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
